apiVersion: apps/v1
kind: Deployment
metadata:
  name: auth-common
spec:
  replicas: 3
  selector:
    matchLabels:
      app: auth-common
  template:
    metadata:
      labels:
        app: auth-common
    spec:
      serviceAccountName: auth-common
      containers:
        - name: auth-common
          image: gcr.io/PROJECT_ID/auth-common:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: SPRING_PROFILES_ACTIVE
              value: gke
          envFrom:
            - configMapRef:
                name: auth-common-config
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: http
            initialDelaySeconds: 20
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: http
            initialDelaySeconds: 40
            periodSeconds: 20
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: 1000m
              memory: 1Gi
