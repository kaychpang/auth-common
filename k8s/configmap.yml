apiVersion: v1
kind: ConfigMap
metadata:
  name: auth-common-config
data:
  AUTH0_ISSUER_URI: "https://your-tenant.us.auth0.com/"
  AUTH0_AUDIENCE: "https://your-api-identifier"
  AUTH0_USER_ID_CLAIM: "sub"
  REDIS_HOST: "10.0.0.10"
  REDIS_PORT: "6379"
  REDIS_SSL_ENABLED: "false"
  REDIS_TIMEOUT: "2s"
  AUTHORIZATION_CACHE_TTL: "5m"
  POSTGRES_HOST: "postgres"
  POSTGRES_PORT: "5432"
  POSTGRES_DB: "auth_common"
  DB_MAX_POOL_SIZE: "10"
  DB_MIN_IDLE: "2"
  PUBSUB_PROJECT_ONE_ENABLED: "true"
  PUBSUB_PROJECT_ONE_ID: "first-gcp-project-id"
  PUBSUB_PROJECT_ONE_TOPIC_ID: "first-events-topic"
  PUBSUB_PROJECT_ONE_SUBSCRIPTION_ID: "auth-common-first-events"
  PUBSUB_PROJECT_TWO_ENABLED: "true"
  PUBSUB_PROJECT_TWO_ID: "second-gcp-project-id"
  PUBSUB_PROJECT_TWO_TOPIC_ID: "second-events-topic"
  PUBSUB_PROJECT_TWO_SUBSCRIPTION_ID: "auth-common-second-events"
